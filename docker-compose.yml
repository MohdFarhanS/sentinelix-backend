services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelix-postgres
    environment:
      POSTGRES_USER: sentinelix
      POSTGRES_PASSWORD: sentinelix
      POSTGRES_DB: sentinelix
    ports:
      - "5433:5432"
    volumes:
      - sentinelix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelix"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelix-redis
    ports:
      - "6379:6379"
    volumes:
      - sentinelix_redisdata:/data
    healthcheck:
      test: ["CMD", "redis_cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  sentinelix_pgdata:
  sentinelix_redisdata: