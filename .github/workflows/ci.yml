name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelix
          POSTGRES_PASSWORD: sentinelix
          POSTGRES_DB: sentinelix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test ./... -v
        env:
          DATABASE_URL: postgres://sentinelix:sentinelix@localhost:5432/sentinelix?sslmode=disable

      - name: Build
        run: go build ./...