name: Database Migration

on:
  workflow_dispatch:
    inputs:
      direction:
        description: "Migration direction. Pick 'check' first to verify connectivity without running anything."
        required: true
        type: choice
        options:
          - check
          - up
          - down
        default: check
      steps:
        description: "Number of migration steps. Leave empty for 'up' = apply all pending. REQUIRED for 'down'. Unused for 'check'."
        required: false
        type: string

concurrency:
  group: db-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install golang-migrate CLI (postgres-only build, matching go.mod version)
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Guard - 'down' requires explicit steps
        if: ${{ inputs.direction == 'down' && inputs.steps == '' }}
        run: |
          echo "::error::Migration 'down' requires an explicit number of steps. Rolling back without a step limit is not allowed through this workflow."
          exit 1

      - name: Check current migration version
        run: migrate -database "$DATABASE_URL" -path migrations version || echo "no migration has run on this database yet"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run migration UP (all pending)
        if: ${{ inputs.direction == 'up' && inputs.steps == '' }}
        run: migrate -database "$DATABASE_URL" -path migrations up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run migration UP (N steps)
        if: ${{ inputs.direction == 'up' && inputs.steps != '' }}
        run: migrate -database "$DATABASE_URL" -path migrations up ${{ inputs.steps }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run migration DOWN (N steps)
        if: ${{ inputs.direction == 'down' }}
        run: migrate -database "$DATABASE_URL" -path migrations down ${{ inputs.steps }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check migration version after execution
        if: ${{ inputs.direction != 'check' }}
        run: migrate -database "$DATABASE_URL" -path migrations version
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}