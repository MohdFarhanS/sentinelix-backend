name: Database Migration

on:
  workflow_dispatch:
    inputs:
      direction:
        description: "Arah migration. Pilih 'check' dulu buat tes koneksi tanpa eksekusi apapun."
        required: true
        type: choice
        options:
          - check
          - up
          - down
        default: check
      steps:
        description: "Jumlah step migration. Kosongkan untuk 'up' = semua pending. WAJIB diisi untuk 'down'. Tidak dipakai untuk 'check'."
        required: false
        type: string

concurrency:
  group: db-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install golang-migrate CLI (postgres-only build, versi sama dengan go.mod)
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Guard - 'down' wajib isi steps eksplisit
        if: ${{ inputs.direction == 'down' && inputs.steps == '' }}
        run: |
          echo "::error::Migration 'down' wajib isi jumlah steps eksplisit. Rollback tanpa batas steps tidak diizinkan lewat workflow ini."
          exit 1

      - name: Cek versi migration saat ini
        run: migrate -database "$DATABASE_URL" -path migrations version || echo "belum ada migration yang jalan sebelumnya"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Jalankan migration UP (semua pending)
        if: ${{ inputs.direction == 'up' && inputs.steps == '' }}
        run: migrate -database "$DATABASE_URL" -path migrations up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Jalankan migration UP (N steps)
        if: ${{ inputs.direction == 'up' && inputs.steps != '' }}
        run: migrate -database "$DATABASE_URL" -path migrations up ${{ inputs.steps }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Jalankan migration DOWN (N steps)
        if: ${{ inputs.direction == 'down' }}
        run: migrate -database "$DATABASE_URL" -path migrations down ${{ inputs.steps }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Cek versi migration setelah eksekusi
        if: ${{ inputs.direction != 'check' }}
        run: migrate -database "$DATABASE_URL" -path migrations version
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}